<div class="modal-container">
  <h2 mat-dialog-title>Editar Playlist</h2>

  <div mat-dialog-content>
    <form #editForm="ngForm" class="form-container">
      <mat-form-field appearance="fill" style="width: 100%;">
        <mat-label>Nombre</mat-label>
        <input matInput [(ngModel)]="playlist.nombre" name="nombre" required />
      </mat-form-field>

      <mat-form-field appearance="fill" style="width: 100%;">
        <mat-label>Descripción</mat-label>
        <input matInput [(ngModel)]="playlist.descripcion" name="descripcion" />
      </mat-form-field>
    </form>

    <h3 style="margin-top: 14px;">Canciones</h3>

    <table mat-table [dataSource]="playlist.canciones" class="mat-elevation-z2" style="width: 100%; margin-top: 12px;">
      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let c"> {{c.id}} </td>
      </ng-container>

      <!-- Título -->
      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef> Título </th>
        <td mat-cell *matCellDef="let c"> {{c.titulo}} </td>
      </ng-container>

      <!-- Artista -->
      <ng-container matColumnDef="artista">
        <th mat-header-cell *matHeaderCellDef> Artista </th>
        <td mat-cell *matCellDef="let c"> {{c.artista}} </td>
      </ng-container>

      <!-- Álbum -->
      <ng-container matColumnDef="album">
        <th mat-header-cell *matHeaderCellDef> Álbum </th>
        <td mat-cell *matCellDef="let c"> {{c.album}} </td>
      </ng-container>

      <!-- Año -->
      <ng-container matColumnDef="anno">
        <th mat-header-cell *matHeaderCellDef> Año </th>
        <td mat-cell *matCellDef="let c"> {{c.anno}} </td>
      </ng-container>

      <!-- Género -->
      <ng-container matColumnDef="genero">
        <th mat-header-cell *matHeaderCellDef> Género </th>
        <td mat-cell *matCellDef="let c"> {{c.genero}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['id', 'titulo', 'artista', 'album', 'anno', 'genero']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['id', 'titulo', 'artista', 'album', 'anno', 'genero']"></tr>
    </table>
  </div>


  <div mat-dialog-actions align="center" style="margin-top: 24px;">
    <button mat-raised-button color="primary" type="submit" class="full-width">
        Cerrar
      </button>

      <button mat-button color="accent" type="button" class="full-width" >
        Guardar
      </button>
  </div>
</div>
