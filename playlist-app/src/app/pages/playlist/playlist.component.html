<div class="tabla-contenedor">

  <!-- Campo de búsqueda -->
  <mat-form-field appearance="fill" class="filtro-busqueda">
    <mat-label>Buscar</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ej: Javier" #input>
  </mat-form-field>

  <div class="mat-elevation-z8 tabla-scroll">

    <table mat-table [dataSource]="dataSource" matSort>

      <!-- Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
        <td mat-cell *matCellDef="let row"> {{ row.nombre }} </td>
      </ng-container>

      <!-- Descripción -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Descripción </th>
        <td mat-cell *matCellDef="let row"> {{ row.descripcion }} </td>
      </ng-container>

      <!-- Cantidad de canciones -->
      <ng-container matColumnDef="canciones">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Canciones </th>
        <td mat-cell *matCellDef="let row"> {{ row.canciones }} </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" aria-label="Editar" (click)="editar(row)" class="action-button">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" aria-label="Eliminar" (click)="eliminar(row)" class="action-button">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Filas -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Sin resultados -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">
          No data matching the filter "{{ input.value }}"
        </td>
      </tr>

    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>

  </div>
</div>
